name: Validate and Push Nginx files to Development

on:
  push:
    branches-ignore:
      - main  

  pull_request:
    branches:
      - develop

  workflow_dispatch:

jobs:
  validate:
    runs-on: robot-shop-runner-azure-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Validate lua configuration
        run: |
          set -e

          for file in httplua/*.lua; do
            luac -p "$file"
          done

          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
          scp -o StrictHostKeyChecking=no -r httplua/* \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/WebServer/nginx-tmp/lua/

          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          sudo cp -r /home/WebServer/nginx-tmp/lua/* /etc/nginx/tmp/lua/

      - name: Validate nginx configuration
        env:
          LUA_DIR: /etc/nginx/tmp/lua
        run: |
          set -e

          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
          scp -o StrictHostKeyChecking=no -r nginx/* \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/WebServer/nginx-tmp/

          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          sudo cp -r /home/WebServer/nginx-tmp/* /etc/nginx/tmp/

          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          export LUA_DIR=${{ env.LUA_DIR }} && sudo -E nginx -t -c /etc/nginx/tmp/nginx.conf
          
  deploy:
    if: ${{ github.ref_name == 'develop' }}
    needs: validate
    runs-on: robot-shop-runner-azure-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Copy lua configuration files to server
        run: |
          set -e

          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
          scp -o StrictHostKeyChecking=no -r httplua/* \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/etc/nginx/lua/

      - name: Copy nginx configuration files to server
        run: |
          set -e

          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
          scp -o StrictHostKeyChecking=no -r nginx/* \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/etc/nginx/

      - name: Reload nginx configuration on server
        run: |
          set -e

          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          sudo nginx -t \
          sudo systemctl reload nginx